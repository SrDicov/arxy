name: lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck

      - name: "regenerar src/arxy* desde lib/ (sin cambios pendientes)"
        run: |
          make build
          test -z "$(git status --porcelain -- src/ packaging/void/arxy/files/ config/)"
          echo REGEN_OK

      - name: bash -n
        run: bash -n src/arxy* && bash -n install.sh && bash -n lib/*.sh && echo BASHN_OK

      - name: shellcheck (cero warnings)
        run: shellcheck -S warning src/arxy* install.sh && echo SHELLCHECK_OK

      - name: packaging/void en sincronia con src/ y config/
        run: |
          for f in src/arxy*; do cmp "$f" "packaging/void/arxy/files/$(basename "$f")"; done
          cmp config/arxy.conf packaging/void/arxy/files/arxy.conf
          cmp config/arxy.pub packaging/void/arxy/files/arxy.pub
          echo SYNC_OK

  sig-vector:
    # La cripto real solo corre con binario presente; los fakes no bastan.
    # Este job instala minisign para que el vector conocido + roundtrip de
    # test-signature.sh ejecuten (no SKIP) en cada push/PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: test-signature.sh con minisign real
        run: |
          bash tests/test-signature.sh | tee /tmp/sig.log
          grep -q 'TODO_OK' /tmp/sig.log
          ! grep -q '^SKIP' /tmp/sig.log
